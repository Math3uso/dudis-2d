name: Linux GCC Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev

    - name: Configure
      run: cmake -S dudis-2d/tests -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build
